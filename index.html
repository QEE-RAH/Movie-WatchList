<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="movie.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="two">
                <div class="movie">
                    <i class="fa-solid fa-clapperboard"></i>
                </div>
                <div class="track">
                    <h2>Movie WatchList</h2>
                    <p>Track the movie you've watched or plan to watch</p>
                </div>
            </div>
            <div class="three">
                <i class="fa-regular fa-clock"></i>
                <p>Wednesday, 15 July 2026</p>
                <button>11:45am</button>
                <div class="settings">
                    <button class="mode-toggle">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="box-1">
            <div class="add">
                <div class="plus">
                    <i class="fa-solid fa-square-plus"></i>
                    <p>Add New Movie</p>
                </div>
                <div class="four">
                    <div class="title">
                        <p>Movie Title</p>
                        <input type="text" id="movie-title" placeholder="e.g Intersellar">
                    </div>
                    <div class="genre">
                        <p>Genre</p>
                        <select name="" id="movie-genre">
                            <option value="Action">Action</option>
                            <option value="Adeventure">Adventure</option>
                            <option value="Animation">Animation</option>
                            <option value="Biography">Biography</option>
                            <option value="Comedy">Comedy</option>
                            <option value="Crime">Crime</option>
                            <option value="Documentary">Documentary</option>
                            <option value="Drama">Drama</option>
                            <option value="Family">Family</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="History">History</option>
                            <option value="Horror">Horror</option>
                            <option value="Music">Music</option>
                            <option value="Musical">Musical</option>
                            <option value="Mystery">Mystery</option>
                            <option value="Romance">Romance</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Sport">Sport</option>
                            <option value="Superhero">Superhero</option>
                            <option value="Thriller">Thriller</option>
                            <option value="War">War</option>
                            <option value="Western">Western</option>
                        </select>
                    </div>
                    <div class="duration">
                        <p>Duration</p>
                        <input type="text" id="movie-duration" placeholder="e.g 2hr 49m">
                    </div>
                    <div class="poster">
                        <p>Poster URL(Optional)</p>
                        <input type="text" id="movie-poster" placeholder="e.g https://">
                    </div>
                </div>
                <div class="twos">
                    <div class="watch">
                        <p>Status</p>
                        <select name="" id="movie-status">
                            <option value="Watch">Watch</option>
                            <option value="Watched">Watched</option>
                        </select>
                    </div>
                    <div class="add-btn">
                        <button id="add-movie-btn">+ Add Movie</button>
                    </div>
                </div>
            </div>
            <div class="popcorn">
                    <img src="images/popcorn.png" alt="">
                </div>
        </div>
        <div class="box-2">
            <div class="controls">
                <div class="left-control">
                    <input type="search" placeholder="Search your watchlist...">
                    <span>Filter:</span>
                    <button>All</button>
                    <button>Watched</button>
                    <button>Not Watched</button>
                </div>  
                <div class="stats-bar">
                    <span class="stat">
                        Total movies: <span id="total-count">0</span>
                    </span>
                    <span class="stat">
                        Watched: <span id="watched-count">0</span>
                    </span>
                    <span class="stat">
                        Not Watched: <span id="unwatched-count">0</span>
                    </span>
                </div>
            </div>
            <div class="mtable">
                <table class="movie-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Poster</th>
                            <th>Movie Title</th>
                            <th>Genre</th>
                            <th>Duration</th>
                            <th>Date Added</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="movie-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="movie.js"></script>
</body>
</html>
