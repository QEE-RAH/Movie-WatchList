<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="movie.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="two">
                <div class="movie">
                    <i class="fa-solid fa-clapperboard"></i>
                </div>
                <div class="track">
                    <h2>Movie WatchList</h2>
                    <p>Track the movie you've watched or plan to watch</p>
                </div>
            </div>
            <div class="three">
                <i class="fa-regular fa-clock"></i>
                <p>Wednesday, 15 July 2026</p>
                <button>11:45am</button>
                <div class="settings">
                <i class="fa-solid fa-gear"></i>
                <div class="lists">
                    <ul>
                        <li>Light Mode</li>
                        <li>Dark Mode</li>
                    </ul>
                </div>
                </div>
            </div>
        </div>
        <div class="box-1">
            <div class="add">
                <div class="plus">
                    <i class="fa-solid fa-square-plus"></i>
                    <p>Add New Movie</p>
                </div>
                <div class="four">
                    <div class="title">
                        <p>Movie Title</p>
                        <input type="text" placeholder="e.g Intersellar">
                    </div>
                    <div class="genre">
                        <p>Genre</p>
                        <select name="" id="">
                            <option value="Select Genre">Action</option>
                            <option value="Select Genre">Adventure</option>
                            <option value="Select Genre">Animation</option>
                            <option value="Select Genre">Biography</option>
                            <option value="Select Genre">Comedy</option>
                            <option value="Select Genre">Crime</option>
                            <option value="Select Genre">Documentary</option>
                            <option value="Select Genre">Drama</option>
                            <option value="Select Genre">Family</option>
                            <option value="Select Genre">Fantasy</option>
                            <option value="Select Genre">History</option>
                            <option value="Select Genre">Horror</option>
                            <option value="Select Genre">Music</option>
                            <option value="Select Genre">Musical</option>
                            <option value="Select Genre">Mystery</option>
                            <option value="Select Genre">Romance</option>
                            <option value="Select Genre">Sci-Fi</option>
                            <option value="Select Genre">Sport</option>
                            <option value="Select Genre">Superhero</option>
                            <option value="Select Genre">Thriller</option>
                            <option value="Select Genre">War</option>
                            <option value="Select Genre">Western</option>
                        </select>
                    </div>
                    <div class="duration">
                        <p>Duration</p>
                        <input type="number" placeholder="e.g 2hr 49m">
                    </div>
                    <div class="poster">
                        <p>Poster URL(Optional)</p>
                        <input type="text" placeholder="e.g https://">
                    </div>
                </div>
                <div class="twos">
                    <div class="watch">
                        <p>Status</p>
                        <select name="" id="">
                            <option value="">Watch</option>
                            <option value="">Watched</option>
                        </select>
                    </div>
                    <div class="add-btn">
                        <button>+ Add Movie</button>
                    </div>
                </div>
            </div>
            <div class="popcorn">
                    <img src="IMAGE/popcorn.png" alt="">
                </div>
        </div>
        <div class="box-2">
            
        </div>
    </div>
    <script src="movie.js"></script>
</body>
</html>
